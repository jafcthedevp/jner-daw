[package]
name = "jner-daw"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Native desktop DAW — M10 WAV Export"
publish = false

[dependencies]
cpal = "=0.18.2"
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
rtrb = "=0.4.1"
hound = "=3.5.1"
rubato = "=5.0.1"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
