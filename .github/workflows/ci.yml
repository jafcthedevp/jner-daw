name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.1

      - name: Instalar Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Comprobar formato
        run: cargo fmt --all -- --check

      - name: Comprobar compilación
        run: cargo check --workspace --all-targets --locked

      - name: Ejecutar Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Ejecutar pruebas unitarias
        run: cargo test --workspace --locked

      - name: Verificar guardado y audio offline
        run: cargo run --locked -- --smoke-project

      - name: Verificar exportación WAV offline
        run: cargo run --locked -- --smoke-export
